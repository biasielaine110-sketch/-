# Cloudflare Pages — project root is this `web/` directory.
# Dashboard: Framework preset = Vite, Build = npm run build, Output = dist
name = "infinite-atelier"
compatibility_date = "2025-03-01"
pages_build_output_dir = "dist"
# allow_custom_ports: seetacloud / ComfyUI pods use :8443; without this flag Workers
# fetch() silently hits :443 and the edge returns HTTP 522.
compatibility_flags = ["nodejs_compat", "allow_custom_ports"]
