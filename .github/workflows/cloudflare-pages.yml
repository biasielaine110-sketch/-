# Push to main → build web/ and deploy to Cloudflare Pages (infinite-atelier).
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — Account API token with Pages Edit
#   CLOUDFLARE_ACCOUNT_ID  — bc7880f6f1908a4fe09bc014e672af0d
name: Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cloudflare API occasionally returns 10429 rate-limit during burst deploys.
    continue-on-error: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # gitHubToken lets wrangler-action post the deployment URL back to the commit, which is
          # the only way to tell "deployed to preview" apart from "deployed to production" when
          # the step fails (2026-11-06: step 6 failed, the retry step exited 0, yet
          # infinite-atelier.pages.dev stayed on the previous build).
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=infinite-atelier --branch=main
        # wrangler-action has no built-in backoff; a short shell retry covers 10429 spikes.
      - name: Retry deploy if rate-limited
        if: failure()
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "wrangler $(npx wrangler --version 2>&1 | tail -1)"
          ls -1 dist | head -5
          for i in 1 2 3; do
            echo "Retry deploy attempt $i after rate-limit cooldown..."
            sleep $((i * 40))
            if npx wrangler pages deploy dist --project-name=infinite-atelier --branch=main; then
              echo "retry $i succeeded"
              exit 0
            fi
            echo "retry $i failed"
          done
          exit 1
